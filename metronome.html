```html
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Metronome</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#1b1b1b;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:900px;
text-align:center;
}

.bpm{
font-size:90px;
font-weight:700;
color:#ff5a43;
}

.controls{
display:flex;
align-items:center;
justify-content:center;
gap:20px;
margin:20px 0;
}

button{
border:none;
border-radius:50%;
width:50px;
height:50px;
font-size:22px;
background:#2a2a2a;
color:white;
cursor:pointer;
}

button:hover{
background:#444;
}

.slider{
width:500px;
}

.play{
width:80px;
height:80px;
font-size:28px;
background:#ff5a43;
margin:20px auto;
}

.indicator{
display:flex;
justify-content:center;
gap:40px;
margin:30px 0;
font-size:30px;
}

.dot{
opacity:0.2;
}

.active{
opacity:1;
}

.subdivisions{
display:flex;
justify-content:center;
gap:40px;
margin:20px 0;
}

.subdivisions button{
width:80px;
height:80px;
border-radius:10px;
background:#3a3a3a;
font-size:28px;
}

.subdivisions button.activeSub{
background:#ff5a43;
}

select{
background:#333;
color:white;
border:none;
padding:8px;
font-size:16px;
}

.pendulum{
height:200px;
position:relative;
}

.arm{
width:4px;
height:160px;
background:white;
position:absolute;
bottom:0;
left:50%;
transform-origin:bottom;
}

.weight{
width:24px;
height:24px;
background:#ff5a43;
border-radius:50%;
position:absolute;
bottom:40px;
left:-10px;
}

.timer{
font-size:36px;
margin-top:20px;
}

.timerButtons{
margin-top:10px;
display:flex;
justify-content:center;
gap:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="bpm" id="bpmDisplay">90</div>

<div class="controls">
<button onclick="bpmDown()">-</button>
<input class="slider" id="slider" type="range" min="40" max="150" value="90">
<button onclick="bpmUp()">+</button>
</div>

<select id="sound">
<option value="digital">digital</option>
<option value="drum">drum</option>
<option value="met">metronome</option>
</select>

<div class="indicator" id="indicator"></div>

<button class="play" onclick="toggleMetronome()">▶</button>

<div class="pendulum">
<div class="arm" id="arm">
<div class="weight"></div>
</div>
</div>

<div class="subdivisions">

<button onclick="setSub(1)" id="sub1">♩</button>
<button onclick="setSub(2)" id="sub2">♪</button>
<button onclick="setSub(3)" id="sub3">♩♪♩</button>
<button onclick="setSub(4)" id="sub4">♬</button>

</div>

<div class="timer" id="timer">00:00</div>

<div class="timerButtons">
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

</div>

<script>

let bpm=90
let subdivision=1
let running=false

const audioCtx=new(window.AudioContext||window.webkitAudioContext)()

let nextTime=0
let scheduler=null
let step=0

const lookahead=25
const ahead=0.1

const slider=document.getElementById("slider")
const bpmDisplay=document.getElementById("bpmDisplay")

slider.oninput=e=>{
bpm=parseInt(e.target.value)
bpmDisplay.innerText=bpm
}

function bpmUp(){ if(bpm<150){ bpm++; slider.value=bpm; slider.oninput({target:{value:bpm}})} }
function bpmDown(){ if(bpm>40){ bpm--; slider.value=bpm; slider.oninput({target:{value:bpm}})} }

function setSub(s){

subdivision=s

document.querySelectorAll(".subdivisions button")
.forEach(b=>b.classList.remove("activeSub"))

document.getElementById("sub"+s).classList.add("activeSub")

drawIndicator()

}

function drawIndicator(){

const ind=document.getElementById("indicator")

ind.innerHTML=""

let count=subdivision

for(let i=0;i<count;i++){

const d=document.createElement("div")
d.className="dot"
d.innerText="●"

ind.appendChild(d)

}

}

drawIndicator()
setSub(1)

function playClick(time){

const osc=audioCtx.createOscillator()
const gain=audioCtx.createGain()

osc.connect(gain)
gain.connect(audioCtx.destination)

gain.gain.value=0.35

const type=document.getElementById("sound").value

if(type==="digital")osc.frequency.value=1000
if(type==="drum")osc.frequency.value=200
if(type==="met")osc.frequency.value=800

osc.start(time)
osc.stop(time+0.03)

}

function schedule(){

const interval=(60/bpm)/subdivision

while(nextTime<audioCtx.currentTime+ahead){

playClick(nextTime)

flashIndicator()

nextTime+=interval

}

}

function toggleMetronome(){

if(!running){

audioCtx.resume()

nextTime=audioCtx.currentTime

scheduler=setInterval(schedule,lookahead)

running=true

}else{

clearInterval(scheduler)

running=false

}

}

function flashIndicator(){

const dots=document.querySelectorAll(".dot")

dots.forEach(d=>d.classList.remove("active"))

dots[step%subdivision].classList.add("active")

step++

}

const arm=document.getElementById("arm")

function animate(){

const angle=Math.sin(audioCtx.currentTime*bpm/60*Math.PI)*30

arm.style.transform="rotate("+angle+"deg)"

requestAnimationFrame(animate)

}

animate()

let timerInterval=null
let startTime=0
let elapsed=0

function updateTimer(){

const t=performance.now()-startTime+elapsed

let sec=Math.floor(t/1000)
let min=Math.floor(sec/60)

sec%=60

document.getElementById("timer").innerText=
String(min).padStart(2,'0')+":"+String(sec).padStart(2,'0')

}

function startTimer(){

startTime=performance.now()

timerInterval=setInterval(updateTimer,200)

}

function pauseTimer(){

elapsed+=performance.now()-startTime

clearInterval(timerInterval)

}

function resetTimer(){

elapsed=0

clearInterval(timerInterval)

document.getElementById("timer").innerText="00:00"

}

</script>

</body>
</html>
